services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    container_name: iwap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IWAP_POSTGRES_DB:-iwap}
      POSTGRES_USER: ${IWAP_DATASOURCE_USERNAME:-iwap}
      POSTGRES_PASSWORD: ${IWAP_DATASOURCE_PASSWORD:-iwap}
    ports:
      - "${IWAP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - iwap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IWAP_DATASOURCE_USERNAME:-iwap} -d ${IWAP_POSTGRES_DB:-iwap}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    platform: linux/amd64
    container_name: iwap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IWAP_DATASOURCE_URL: ${IWAP_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/iwap}
      IWAP_DATASOURCE_USERNAME: ${IWAP_DATASOURCE_USERNAME:-iwap}
      IWAP_DATASOURCE_PASSWORD: ${IWAP_DATASOURCE_PASSWORD:-iwap}
      IWAP_AI_PROVIDER: ${IWAP_AI_PROVIDER:-mock}
      IWAP_INTEGRATION_MODE: ${IWAP_INTEGRATION_MODE:-mock}
      IWAP_DEMO_JWT_SECRET: ${IWAP_DEMO_JWT_SECRET:-change-me-for-real-deployments}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key-not-used-in-mock-mode}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DEFAULT_CHANNEL: "${SLACK_DEFAULT_CHANNEL:-#sales-report}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "${IWAP_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_IWAP_API_BASE_URL: ${NEXT_PUBLIC_IWAP_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_IWAP_WS_URL: ${NEXT_PUBLIC_IWAP_WS_URL:-ws://localhost:8080/ws/workflows}
    platform: linux/amd64
    container_name: iwap-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_IWAP_API_BASE_URL: ${NEXT_PUBLIC_IWAP_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_IWAP_WS_URL: ${NEXT_PUBLIC_IWAP_WS_URL:-ws://localhost:8080/ws/workflows}
    ports:
      - "${IWAP_FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  iwap-postgres-data:
