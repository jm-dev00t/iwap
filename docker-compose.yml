services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: iwap
      POSTGRES_USER: iwap
      POSTGRES_PASSWORD: ${IWAP_DATASOURCE_PASSWORD:-iwap}
    ports:
      - "${IWAP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - iwap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iwap -d iwap"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IWAP_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iwap
      IWAP_DATASOURCE_USERNAME: iwap
      IWAP_DATASOURCE_PASSWORD: iwap
      IWAP_AI_PROVIDER: ${IWAP_AI_PROVIDER:-mock}
      IWAP_INTEGRATION_MODE: ${IWAP_INTEGRATION_MODE:-mock}
      IWAP_DEMO_JWT_SECRET: ${IWAP_DEMO_JWT_SECRET:-change-me-for-real-deployments}
      IWAP_ALLOWED_ORIGINS: ${IWAP_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      IWAP_SPRING_AI_CHAT_MODEL: ${IWAP_SPRING_AI_CHAT_MODEL:-none}
      IWAP_OPENAI_CHAT_MODEL: ${IWAP_OPENAI_CHAT_MODEL:-}
      IWAP_OPENAI_BASE_URL: ${IWAP_OPENAI_BASE_URL:-https://api.openai.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DEFAULT_CHANNEL: ${SLACK_DEFAULT_CHANNEL:-#sales-report}
    ports:
      - "${IWAP_BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_IWAP_API_BASE_URL: ${NEXT_PUBLIC_IWAP_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_IWAP_WS_URL: ${NEXT_PUBLIC_IWAP_WS_URL:-http://localhost:8080/ws/workflows}
    ports:
      - "${IWAP_FRONTEND_PORT:-3000}:3000"

volumes:
  iwap-postgres-data:
