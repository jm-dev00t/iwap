spring:
  application:
    name: iwap-backend
  datasource:
    url: ${IWAP_DATASOURCE_URL:jdbc:postgresql://${IWAP_DATABASE_HOST:localhost}:${IWAP_DATABASE_PORT:5432}/${IWAP_DATABASE_NAME:iwap}}
    username: ${IWAP_DATASOURCE_USERNAME:iwap}
    password: ${IWAP_DATASOURCE_PASSWORD:iwap}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    model:
      chat: ${IWAP_SPRING_AI_CHAT_MODEL:none}
      embedding: ${IWAP_SPRING_AI_EMBEDDING_MODEL:none}
      image: ${IWAP_SPRING_AI_IMAGE_MODEL:none}
      moderation: ${IWAP_SPRING_AI_MODERATION_MODEL:none}
      audio:
        speech: ${IWAP_SPRING_AI_AUDIO_SPEECH_MODEL:none}
        transcription: ${IWAP_SPRING_AI_AUDIO_TRANSCRIPTION_MODEL:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${IWAP_OPENAI_CHAT_MODEL:}

server:
  port: ${IWAP_BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

iwap:
  ai:
    # Mock mode keeps portfolio demos deterministic and cost-free when no provider key is present.
    provider: ${IWAP_AI_PROVIDER:mock}
  integrations:
    # Demo mode routes external tools to mock adapters unless credentials are explicitly provided.
    mode: ${IWAP_INTEGRATION_MODE:mock}
  security:
    demo-jwt-secret: ${IWAP_DEMO_JWT_SECRET:change-me-for-real-deployments}
    allowed-origins: ${IWAP_ALLOWED_ORIGINS:http://localhost:3000}
  web:
    allowed-origin-patterns: ${IWAP_WEB_ALLOWED_ORIGIN_PATTERNS:${IWAP_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
